<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lala — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css?v=4">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="icon" type="image/png" href="logo-removebg-preview.png">
  <style>
    /* ── Page-specific: reset password only ─────────────────────── */
    .step { display: none; }
    .step.visible { display: flex; flex-direction: column; gap: 18px; }

    .auth-ok {
      background: #F0FDF4;
      border: 1px solid #BBF7D0;
      color: #15803D;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 10px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .auth-ok.visible { display: flex; }
    .auth-ok i { font-size: 16px; }

    .back-link { text-align: center; font-size: 13px; color: var(--muted); }
    .back-link a { color: var(--g-dark); font-weight: 700; text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>
<body class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
        <a href="guest-login.html" style="color:#fff;font-size:20px;text-decoration:none;position:relative;z-index:1;"><i class="ti ti-arrow-left"></i></a>
        <span style="font-weight:700;font-size:18px;color:#fff;position:relative;z-index:1;">lala</span>
      </div>
      <div class="auth-title">Reset Password</div>
      <div class="auth-sub">We'll send you a reset code</div>
    </div>
    <div class="auth-body">
      <div class="auth-err" id="errorMsg">
        <i class="ti ti-alert-circle"></i>
        <span id="errorText">Something went wrong</span>
      </div>
      <div class="auth-ok" id="successMsg">
        <i class="ti ti-circle-check"></i>
        <span id="successText">Success!</span>
      </div>

      <!-- Step 1: Request code -->
      <div class="step visible" id="step1">
        <div class="fg">
          <label>Email address</label>
          <div class="icon-field">
            <i class="ti ti-mail"></i>
            <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">
          </div>
        </div>
        <button class="btn-login" id="sendCodeBtn" onclick="sendCode()">
          <i class="ti ti-send"></i> Send Reset Code
        </button>
      </div>

      <!-- Step 2: Enter code + new password -->
      <div class="step" id="step2">
        <div class="fg">
          <label>Reset Code</label>
          <div class="icon-field">
            <i class="ti ti-key"></i>
            <input type="text" id="codeInput" placeholder="Enter 6-digit code" maxlength="6">
          </div>
        </div>
        <div class="fg">
          <label>New Password</label>
          <div class="icon-field">
            <i class="ti ti-lock"></i>
            <input type="password" id="passwordInput" placeholder="Min. 6 characters">
          </div>
        </div>
        <div class="fg">
          <label>Confirm New Password</label>
          <div class="icon-field">
            <i class="ti ti-lock"></i>
            <input type="password" id="confirmInput" placeholder="Repeat password">
          </div>
        </div>
        <button class="btn-login" id="resetBtn" onclick="resetPassword()">
          <i class="ti ti-check"></i> Reset Password
        </button>
      </div>

      <div class="back-link">
        <a href="guest-login.html"><i class="ti ti-arrow-left"></i> Back to Sign In</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    let resetEmail = '';

    function showError(msg) {
      document.getElementById('errorText').textContent = msg;
      document.getElementById('errorMsg').classList.add('visible');
      document.getElementById('successMsg').classList.remove('visible');
    }

    function showSuccess(msg) {
      document.getElementById('successText').textContent = msg;
      document.getElementById('successMsg').classList.add('visible');
      document.getElementById('errorMsg').classList.remove('visible');
    }

    function hideMessages() {
      document.getElementById('errorMsg').classList.remove('visible');
      document.getElementById('successMsg').classList.remove('visible');
    }

    async function sendCode() {
      hideMessages();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      if (!email) return showError('Please enter your email');

      const btn = document.getElementById('sendCodeBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-spinner"></span> Sending...';

      try {
        const data = await (await fetch(`${window.API_URL || 'http://localhost:5000/api'}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        })).json();

        if (data.error) throw new Error(data.error);

        resetEmail = email;
        showSuccess(`Code sent! Check your email. (Dev code: ${data.resetCode})`);
        document.getElementById('step1').classList.remove('visible');
        document.getElementById('step2').classList.add('visible');
        document.getElementById('codeInput').value = data.resetCode; // Auto-fill in dev
      } catch (err) {
        showError(err.message || 'Failed to send code');
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-send"></i> Send Reset Code';
      }
    }

    async function resetPassword() {
      hideMessages();
      const code = document.getElementById('codeInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const confirm = document.getElementById('confirmInput').value;

      if (!code) return showError('Please enter the reset code');
      if (!password || password.length < 6) return showError('Password must be at least 6 characters');
      if (password !== confirm) return showError('Passwords do not match');

      const btn = document.getElementById('resetBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-spinner"></span> Resetting...';

      try {
        const data = await (await fetch(`${window.API_URL || 'http://localhost:5000/api'}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: resetEmail, code, password })
        })).json();

        if (data.error) throw new Error(data.error);

        showSuccess('Password reset successful! Redirecting to sign in...');
        setTimeout(() => { window.location.href = 'guest-login.html'; }, 2000);
      } catch (err) {
        showError(err.message || 'Failed to reset password');
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-check"></i> Reset Password';
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (document.getElementById('step1').classList.contains('visible')) sendCode();
        else if (document.getElementById('step2').classList.contains('visible')) resetPassword();
      }
    });
  </script>
</body>
</html>
