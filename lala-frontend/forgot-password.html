<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lala — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css?v=7">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="icon" type="image/png" href="logo-removebg-preview.png">
  <style>
    .auth-ok {
      background: #F0FDF4;
      border: 1px solid #BBF7D0;
      color: #15803D;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 10px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .auth-ok.visible { display: flex; }
    .auth-ok i { font-size: 16px; }

    .check-icon {
      text-align: center;
      margin-bottom: 8px;
    }
    .check-icon i {
      font-size: 48px;
      color: #1B5E20;
    }

    .back-link { text-align: center; font-size: 13px; color: var(--muted); }
    .back-link a { color: var(--g-dark); font-weight: 700; text-decoration: none; }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>
<body class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
        <a href="guest-login.html" style="color:#fff;font-size:20px;text-decoration:none;position:relative;z-index:1;"><i class="ti ti-arrow-left"></i></a>
        <span style="font-weight:700;font-size:18px;color:#fff;position:relative;z-index:1;">lala</span>
      </div>
      <div class="auth-title">Reset Password</div>
      <div class="auth-sub">We'll email you a reset link</div>
    </div>
    <div class="auth-body">
      <div class="auth-err" id="errorMsg">
        <i class="ti ti-alert-circle"></i>
        <span id="errorText">Something went wrong</span>
      </div>
      <div class="auth-ok" id="successMsg">
        <i class="ti ti-circle-check"></i>
        <span id="successText">Success!</span>
      </div>

      <!-- Email form -->
      <div id="emailForm" style="display:flex;flex-direction:column;gap:18px;">
        <div class="fg">
          <label>Email address</label>
          <div class="icon-field">
            <i class="ti ti-mail"></i>
            <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">
          </div>
        </div>
        <button class="btn-login" id="sendLinkBtn" onclick="sendLink()">
          <i class="ti ti-send"></i> Send Reset Link
        </button>
      </div>

      <!-- Success state -->
      <div id="sentState" style="display:none;text-align:center;padding:20px 0;">
        <div class="check-icon"><i class="ti ti-mail-check"></i></div>
        <p style="font-size:14px;color:#333;margin:0 0 6px;font-weight:600;">Check your email</p>
        <p style="font-size:13px;color:#666;margin:0 0 20px;line-height:1.5;">
          We sent a password reset link to<br>
          <strong id="sentEmail" style="color:#111;"></strong>
        </p>
        <button class="btn-login" onclick="resendLink()" style="background:#fff;color:var(--g-dark);border:2px solid #ddd;" id="resendBtn">
          <i class="ti ti-refresh"></i> Resend Link
        </button>
        <p style="font-size:12px;color:#999;margin:12px 0 0;">Link expires in 30 minutes</p>
      </div>

      <div class="back-link" style="margin-top:20px;">
        <a href="guest-login.html"><i class="ti ti-arrow-left"></i> Back to Sign In</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    let resetEmail = '';

    function showError(msg) {
      document.getElementById('errorText').textContent = msg;
      document.getElementById('errorMsg').classList.add('visible');
      document.getElementById('successMsg').classList.remove('visible');
    }

    function showSuccess(msg) {
      document.getElementById('successText').textContent = msg;
      document.getElementById('successMsg').classList.add('visible');
      document.getElementById('errorMsg').classList.remove('visible');
    }

    function hideMessages() {
      document.getElementById('errorMsg').classList.remove('visible');
      document.getElementById('successMsg').classList.remove('visible');
    }

    async function sendLink() {
      hideMessages();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      if (!email) return showError('Please enter your email');

      const btn = document.getElementById('sendLinkBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-spinner"></span> Sending...';

      try {
        const data = await (await fetch(`${window.API_URL || 'http://localhost:5000/api'}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        })).json();

        if (data.error) throw new Error(data.error);

        resetEmail = email;
        document.getElementById('sentEmail').textContent = email;
        document.getElementById('emailForm').style.display = 'none';
        document.getElementById('sentState').style.display = 'block';

        if (data.devResetUrl) {
          showSuccess('Link sent! (Dev: ' + data.devResetUrl + ')');
        }
      } catch (err) {
        showError(err.message || 'Failed to send reset link');
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-send"></i> Send Reset Link';
      }
    }

    async function resendLink() {
      hideMessages();
      const btn = document.getElementById('resendBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-spinner"></span> Resending...';

      try {
        const data = await (await fetch(`${window.API_URL || 'http://localhost:5000/api'}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: resetEmail })
        })).json();

        if (data.error) throw new Error(data.error);
        showSuccess('Link resent! Check your email.');
      } catch (err) {
        showError(err.message || 'Failed to resend link');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-refresh"></i> Resend Link';
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && document.getElementById('emailForm').style.display !== 'none') sendLink();
    });
  </script>
</body>
</html>
