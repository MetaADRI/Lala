<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lala — Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css?v=4">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="icon" type="image/png" href="logo-removebg-preview.png">
  <style>
    /* ── Page-specific: signup only ─────────────────────────────── */
    .features-mini {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }
    .feat-mini {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      padding: 8px 10px;
      background: var(--g-light);
      border-radius: 8px;
    }
    .feat-mini i { color: var(--g-dark); font-size: 14px; }

    /* ── Role selector ──────────────────────────────────────────── */
    .role-select {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }
    .role-card {
      text-align: left;
      padding: 14px;
      border: 2px solid var(--g-light);
      border-radius: var(--r);
      background: var(--g-light);
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.1s ease;
    }
    .role-card:active { transform: scale(0.98); }
    .role-card i { font-size: 20px; color: var(--g-mid); display: block; margin-bottom: 8px; }
    .role-card-title { display: block; font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 2px; }
    .role-card-sub { display: block; font-size: 11px; line-height: 1.35; color: var(--muted); }
    .role-card.selected {
      border-color: var(--g-dark);
      background: #fff;
      box-shadow: var(--shadow-btn);
    }
    .role-card.selected i { color: var(--g-dark); }

    @media (max-width: 480px) {
      .role-select { grid-template-columns: 1fr; }
    }

    /* ── Success Overlay ───────────────────────────────────────── */
    .success-overlay {
      position: fixed; inset: 0; z-index: 9999;
      display: none; align-items: center; justify-content: center;
      background: rgba(15,43,16,0.92);
      backdrop-filter: blur(12px);
      animation: overlayIn 0.5s ease-out;
    }
    .success-overlay.show { display: flex; }
    @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }

    .success-card {
      text-align: center;
      color: #fff;
      animation: cardPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transform: scale(0.8);
      opacity: 0;
    }
    @keyframes cardPop { to { transform: scale(1); opacity: 1; } }

    .success-check {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #43A047, #66BB6A);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
      box-shadow: 0 0 0 rgba(67,160,71,0.4);
      animation: pulseRing 2s ease-in-out infinite;
    }
    @keyframes pulseRing {
      0%, 100% { box-shadow: 0 0 0 0 rgba(67,160,71,0.4); }
      50% { box-shadow: 0 0 0 20px rgba(67,160,71,0); }
    }
    .success-check i { animation: checkDraw 0.6s 0.2s ease-out both; }
    @keyframes checkDraw {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .success-title { font-weight: 800; font-size: 26px; margin-bottom: 8px; }
    .success-sub { font-size: 15px; color: rgba(255,255,255,0.7); margin-bottom: 6px; }
    .success-email { font-size: 13px; color: var(--gold); font-weight: 500; margin-bottom: 28px; }

    .success-loader {
      width: 120px; height: 3px;
      background: rgba(255,255,255,0.15);
      border-radius: 99px;
      margin: 0 auto;
      overflow: hidden;
    }
    .success-loader-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--gold), #66BB6A);
      border-radius: 99px;
      animation: loadBar 2.8s ease-in-out forwards;
    }
    @keyframes loadBar { to { width: 100%; } }

    .confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 10000; overflow: hidden; }
    .confetti-piece {
      position: absolute;
      width: 8px; height: 8px; top: -10px;
      border-radius: 2px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    @media (max-width: 480px) {
      .features-mini { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="auth-shell">
  <div class="auth-card" id="signupCard">
    <div class="auth-head">
      <a href="index.html" class="auth-logo">
        <img src="logo-removebg-preview.png" alt="Lala">
        <span>lala</span>
      </a>
      <div class="auth-title">Create your account</div>
      <div class="auth-sub">Join Lala and start booking stays across Zambia</div>
    </div>

    <div class="auth-body">
      <div class="auth-err" id="errorMsg">
        <i class="ti ti-alert-circle"></i>
        <span id="errorText">Something went wrong</span>
      </div>

      <div class="role-select" id="roleSelect">
        <button type="button" class="role-card selected" data-role="guest" onclick="selectRole(this)">
          <i class="ti ti-calendar-event"></i>
          <span class="role-card-title">I'm booking a stay</span>
          <span class="role-card-sub">Browse and book stays across Zambia</span>
        </button>
        <button type="button" class="role-card" data-role="host" onclick="selectRole(this)">
          <i class="ti ti-building-estate"></i>
          <span class="role-card-title">I'm listing a property</span>
          <span class="role-card-sub">Host travellers and earn with Lala</span>
        </button>
      </div>

      <div class="fg">
        <label>Full name</label>
        <div class="icon-field">
          <i class="ti ti-user"></i>
          <input type="text" id="nameInput" placeholder="e.g. John Banda" autocomplete="name">
        </div>
      </div>

      <div class="fg">
        <label>Email address</label>
        <div class="icon-field">
          <i class="ti ti-mail"></i>
          <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>

      <div class="fg">
        <label>Phone (optional)</label>
        <div class="icon-field">
          <i class="ti ti-phone"></i>
          <input type="tel" id="phoneInput" placeholder="+260 97 000 0000" autocomplete="tel">
        </div>
      </div>

      <div class="fg">
        <label>Password</label>
        <div class="icon-field">
          <i class="ti ti-lock"></i>
          <input type="password" id="passwordInput" placeholder="Create a strong password" autocomplete="new-password">
          <i class="ti ti-eye toggle-pw" id="togglePw" onclick="togglePassword()"></i>
        </div>
      </div>

      <button class="btn-login" id="signupBtn" onclick="handleSignup()">
        <i class="ti ti-user-plus"></i>
        <span id="signupBtnText">Create Account</span>
      </button>

      <div class="divider">or</div>

      <div class="auth-link">
        Already have an account? <a href="guest-login.html">Sign in</a>
      </div>

      <div class="features-mini">
        <div class="feat-mini"><i class="ti ti-brand-whatsapp"></i> WhatsApp Booking</div>
        <div class="feat-mini"><i class="ti ti-wallet"></i> Mobile Money</div>
        <div class="feat-mini"><i class="ti ti-shield-check"></i> Verified Hosts</div>
        <div class="feat-mini"><i class="ti ti-wifi-off"></i> Low-Data Mode</div>
      </div>
    </div>
  </div>

  <div class="success-overlay" id="successOverlay">
    <div class="confetti-container" id="confettiContainer"></div>
    <div class="success-card">
      <div class="success-check"><i class="ti ti-check"></i></div>
      <div class="success-title">Account Created!</div>
      <div class="success-sub">Welcome to Lala — your stay in Zambia starts here</div>
      <div class="success-email" id="successEmail">you@example.com</div>
      <div class="success-loader"><div class="success-loader-bar"></div></div>
      <div style="margin-top: 16px; font-size: 12px; color: rgba(255,255,255,0.4);">Taking you to Lala...</div>
    </div>
  </div>

  <script src="config.js?v=2"></script>
  <script src="api.js?v=2"></script>
  <script>
    function spawnConfetti() {
      const container = document.getElementById('confettiContainer');
      const colors = ['#F9A825','#43A047','#66BB6A','#fff','#E53935','#1E88E5','#8E24AA','#FB8C00'];
      for (let i = 0; i < 60; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.width = (4 + Math.random() * 6) + 'px';
        piece.style.height = (4 + Math.random() * 6) + 'px';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        piece.style.animationDuration = (2 + Math.random() * 2) + 's';
        piece.style.animationDelay = Math.random() * 0.5 + 's';
        container.appendChild(piece);
      }
    }

    function showSuccess(email, role) {
      const isHost = role === 'host';
      document.getElementById('successEmail').textContent = email;
      if (isHost) {
        document.querySelector('.success-title').textContent = 'Host Account Created!';
        document.querySelector('.success-sub').textContent = 'Welcome aboard — start listing your property';
      }
      document.getElementById('successOverlay').classList.add('show');
      spawnConfetti();
      setTimeout(() => {
        window.location.href = isHost ? 'host-dashboard.html' : 'index.html';
      }, 3000);
    }
    function togglePassword() {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('togglePw');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'ti ti-eye-off toggle-pw';
      } else {
        input.type = 'password';
        icon.className = 'ti ti-eye toggle-pw';
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      document.getElementById('errorText').textContent = msg;
      el.classList.add('visible');
    }

    function hideError() {
      document.getElementById('errorMsg').classList.remove('visible');
    }

    let selectedRole = 'guest';

    function selectRole(card) {
      document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedRole = card.getAttribute('data-role');
    }

    async function handleSignup() {
      hideError();

      const name = document.getElementById('nameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const phone = document.getElementById('phoneInput').value.trim();
      const password = document.getElementById('passwordInput').value;

      if (!name) return showError('Please enter your full name');
      if (!email) return showError('Please enter your email address');
      if (!/\S+@\S+\.\S+/.test(email)) return showError('Please enter a valid email address');
      if (!password || password.length < 6) return showError('Password must be at least 6 characters');

      const btn = document.getElementById('signupBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-spinner"></span> Creating account...';

      try {
        const data = await api.register(email, password, name, phone || undefined, selectedRole);
        if (data.error) {
          showError(data.error);
          btn.disabled = false;
          btn.innerHTML = '<i class="ti ti-user-plus"></i> Create Account';
          return;
        }

        showSuccess(email, data.user && data.user.role);
      } catch (err) {
        showError('Failed to connect. Is the backend running?');
        console.error(err);
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-user-plus"></i> Create Account';
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSignup();
    });
  </script>
</body>
</html>
