<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lala â€” Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css?v=6">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="icon" type="image/png" href="logo-removebg-preview.png">
</head>
<body class="auth-shell">
  <div class="auth-card" id="loginCard">
    <div class="auth-head">
      <a href="index.html" class="auth-logo">
        <img src="logo-removebg-preview.png" alt="Lala">
        <span>lala</span>
      </a>
      <div class="auth-title">Welcome back</div>
      <div class="auth-sub">Sign in to manage bookings and more</div>
    </div>

    <div class="auth-body">
      <div class="auth-err" id="errorMsg">
        <i class="ti ti-alert-circle"></i>
        <span id="errorText">Something went wrong</span>
      </div>

      <div class="fg">
        <label>Email address</label>
        <div class="icon-field">
          <i class="ti ti-mail"></i>
          <input type="email" id="emailInput" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>

      <div class="fg">
        <label>Password</label>
        <div class="icon-field">
          <i class="ti ti-lock"></i>
          <input type="password" id="passwordInput" placeholder="Enter your password" autocomplete="current-password">
          <i class="ti ti-eye toggle-pw" id="togglePw" onclick="togglePassword()"></i>
        </div>
        <div style="text-align:right;margin-top:4px;">
          <a href="forgot-password.html" style="font-size:12px;color:var(--g-dark);text-decoration:none;font-weight:600;">Forgot password?</a>
        </div>
      </div>

      <button class="btn-login" id="loginBtn" onclick="handleLogin()">
        <i class="ti ti-login"></i>
        <span id="loginBtnText">Sign In</span>
      </button>

      <div class="divider">or</div>

      <div class="auth-link">
        Don't have an account? <a href="signup.html">Create one</a>
      </div>

      <div class="auth-host">
        <i class="ti ti-building-estate"></i>
        Are you a host? <a href="signup.html">List your property</a>
      </div>
    </div>
  </div>

  <script src="config.js?v=2"></script>
  <script src="api.js?v=2"></script>
  <script>
    function togglePassword() {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('togglePw');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'ti ti-eye-off toggle-pw';
      } else {
        input.type = 'password';
        icon.className = 'ti ti-eye toggle-pw';
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      document.getElementById('errorText').textContent = msg;
      el.classList.add('visible');
    }

    function hideError() {
      document.getElementById('errorMsg').classList.remove('visible');
    }

    async function handleLogin() {
      hideError();

      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const password = document.getElementById('passwordInput').value;

      if (!email) return showError('Please enter your email address');
      if (!password) return showError('Please enter your password');

      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-spinner"></span> Signing in...';

      try {
        const data = await api.login(email, password);
        if (data.error) {
          showError(data.error);
          btn.disabled = false;
          btn.innerHTML = '<i class="ti ti-login"></i> Sign In';
          return;
        }

        // Check for redirect
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect');

        if (redirect) {
          window.location.href = decodeURIComponent(redirect);
        } else if (data.user && data.user.role === 'host') {
          window.location.href = 'host-dashboard.html';
        } else if (data.user && data.user.role === 'admin') {
          window.location.href = 'admin-portal.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (err) {
        showError('Failed to connect. Is the backend running?');
        console.error(err);
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-login"></i> Sign In';
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
