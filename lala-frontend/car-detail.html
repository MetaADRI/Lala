<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lala â€” Book Transfer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css?v=6">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="icon" type="image/png" href="logo-removebg-preview.png">
  <style>
    .detail-wrap { max-width: 560px; margin: 0 auto; padding: 24px; }

    .car-card {
      background: var(--canvas); border-radius: 14px;
      border: 1px solid var(--hairline); overflow: hidden;
      box-shadow: var(--shadow-card);
    }
    .car-img {
      height: 200px; background: linear-gradient(135deg, #A5D6A7, #66BB6A);
      display: flex; align-items: center; justify-content: center;
      font-size: 64px; overflow: hidden;
    }
    .car-img img { width: 100%; height: 100%; object-fit: cover; }
    .car-body { padding: 20px; }
    .car-model { font-weight: 700; font-size: 20px; }
    .car-info { font-size: 14px; color: var(--muted); margin: 4px 0 16px; }
    .prices { display: flex; gap: 12px; }
    .price-box {
      flex: 1; background: var(--surface-soft); border-radius: 10px;
      padding: 14px; text-align: center;
    }
    .price-box .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted-soft); font-weight: 500; }
    .price-box .val { font-size: 20px; font-weight: 700; color: var(--accent-hover); margin-top: 4px; }

    @media (max-width: 768px) {
      .detail-wrap { padding: 16px; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo">
      <img src="logo-removebg-preview.png" alt="Lala Logo" class="logo-img">
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="search.html">Stays</a>
      <a href="transfers.html">Transfers</a>
      <a href="my-bookings.html">My Trips</a>
      <a href="signup.html" style="background:var(--accent);color:#fff;font-weight:600;">List Stays</a>
      <a href="guest-login.html">Sign In</a>
    </div>
    <button class="hamburger" onclick="document.getElementById('mobileMenu').classList.toggle('open')" aria-label="Menu">
      <i class="ti ti-menu-2"></i>
    </button>
  </nav>

  <!-- Mobile menu -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">Home</a>
    <a href="search.html">Stays</a>
    <a href="transfers.html">Transfers</a>
    <a href="my-bookings.html">My Trips</a>
    <a href="signup.html" class="nav-cta">List Your Property</a>
    <a href="guest-login.html">Sign In</a>
  </div>

  <!-- BOTTOM NAV (mobile) -->
  <nav class="bottom-nav">
    <div class="bottom-nav-inner">
      <a href="index.html"><i class="ti ti-home"></i> Home</a>
      <a href="search.html"><i class="ti ti-search"></i> Search</a>
      <a href="transfers.html"><i class="ti ti-car"></i> Rides</a>
      <a href="my-bookings.html"><i class="ti ti-heart"></i> Saved</a>
      <a href="guest-login.html"><i class="ti ti-user"></i> Profile</a>
    </div>
  </nav>

  <div class="detail-wrap">
    <a href="transfers.html" style="display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);text-decoration:none;margin-bottom:16px;">
      <i class="ti ti-arrow-left"></i> Back to transfers
    </a>

    <div class="car-card" id="detail">
      <div class="car-img" id="carImg">ðŸš—</div>
      <div class="car-body">
        <div class="car-model" id="carModel">Loading...</div>
        <div class="car-info" id="carInfo"></div>
        <div class="prices" id="carPrices"></div>
      </div>
    </div>

    <div class="form-card" style="margin-top:20px;">
      <div class="form-title"><i class="ti ti-clipboard-list"></i> Booking Details</div>

      <div class="fg">
        <label>Trip Type</label>
        <select id="tripType" onchange="toggleTripType()">
          <option value="airport">Airport Transfer (fixed price)</option>
          <option value="city">City Ride (per km)</option>
        </select>
      </div>

      <div class="form-row">
        <div class="fg">
          <label>Pickup</label>
          <input type="text" id="pickupLocation" placeholder="e.g. Airport, Hotel...">
        </div>
        <div class="fg">
          <label>Drop-off</label>
          <input type="text" id="dropoffLocation" placeholder="Destination...">
        </div>
      </div>

      <div class="form-row">
        <div class="fg">
          <label>Date</label>
          <input type="date" id="pickupDate">
        </div>
        <div class="fg">
          <label>Time</label>
          <input type="time" id="pickupTime">
        </div>
      </div>

      <div class="fg" id="flightGroup" style="display:none;">
        <label>Flight Number (optional)</label>
        <input type="text" id="flightNumber" placeholder="e.g. ET 873">
      </div>

      <div class="form-row">
        <div class="fg">
          <label>Passengers</label>
          <input type="number" id="passengerCount" value="1" min="1">
        </div>
        <div class="fg">
          <label>Your Phone</label>
          <input type="text" id="guestPhone" placeholder="+260...">
        </div>
      </div>

      <div class="fg">
        <label>Notes (optional)</label>
        <textarea id="notes" rows="2" placeholder="Luggage, special requests..."></textarea>
      </div>

      <button class="btn btn-primary btn-lg btn-block" onclick="book()" id="bookBtn"><i class="ti ti-check"></i> Confirm Booking</button>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="session.js"></script>
  <script src="auth-nav.js?v=1"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const carId = params.get('id');
    let car = null;

    if (!api.isLoggedIn()) {
      document.getElementById('detail').innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);">Please <a href="guest-login.html" style="color:var(--accent);font-weight:600;">log in</a> to book a transfer.</div>';
    }

    async function loadCar() {
      try {
        car = await api.getCar(carId);
        document.getElementById('carModel').textContent = car.model;
        document.getElementById('carInfo').textContent = `ðŸ‘¤ ${car.driverName} Â· ${car.plateNumber} Â· ${car.seats} seats Â· ${car.city}`;
        document.getElementById('carImg').innerHTML = car.photos && car.photos[0] ? `<img src="${car.photos[0]}" alt="">` : 'ðŸš—';
        let html = '';
        if (car.airportPrice) html += `<div class="price-box"><div class="lbl">Airport</div><div class="val">K${car.airportPrice}</div></div>`;
        if (car.pricePerKm) html += `<div class="price-box"><div class="lbl">Per km</div><div class="val">K${car.pricePerKm}</div></div>`;
        document.getElementById('carPrices').innerHTML = html;
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('pickupDate').value = tomorrow.toISOString().split('T')[0];
        const user = api.getUser();
        if (user) document.getElementById('guestPhone').value = user.phone || '';
        toggleTripType();
      } catch (err) {
        document.getElementById('detail').innerHTML = '<div class="state error-state" style="margin:0;"><i class="ti ti-cloud-off"></i><p>Failed to load this driver. Check your connection and try again.</p><button class="btn btn-outline btn-sm" onclick="loadCar()">Retry</button></div>';
      }
    }

    function toggleTripType() {
      const type = document.getElementById('tripType').value;
      document.getElementById('flightGroup').style.display = type === 'airport' ? 'block' : 'none';
    }

    async function book() {
      const msg = document.getElementById('msg');
      const btn = document.getElementById('bookBtn');
      btn.disabled = true;

      const tripType = document.getElementById('tripType').value;
      const data = {
        carId,
        tripType,
        pickupLocation: document.getElementById('pickupLocation').value,
        dropoffLocation: document.getElementById('dropoffLocation').value,
        pickupDate: document.getElementById('pickupDate').value,
        pickupTime: document.getElementById('pickupTime').value,
        passengerCount: parseInt(document.getElementById('passengerCount').value) || 1,
        notes: document.getElementById('notes').value
      };

      if (tripType === 'airport') data.flightNumber = document.getElementById('flightNumber').value;

      if (!data.pickupLocation || !data.dropoffLocation || !data.pickupDate || !data.pickupTime) {
        msg.className = 'msg err';
        msg.textContent = 'Please fill in all required fields';
        btn.disabled = false;
        return;
      }

      if (!api.isLoggedIn()) {
        window.location.href = `guest-login.html?redirect=${encodeURIComponent(window.location.href)}`;
        return;
      }

      const price = car && (tripType === 'airport' ? car.airportPrice : car.pricePerKm);
      if (!price) {
        msg.className = 'msg err';
        msg.textContent = 'This vehicle has no price configured for this trip type.';
        btn.disabled = false;
        return;
      }

      // Transfers follow the lodge payment flow: choose a provider and pay via USSD.
      const params = new URLSearchParams({ ...data, model: car.model, driverName: car.driverName, price });
      window.location.href = `transfer-payment.html?${params.toString()}`;
    }

    if (carId) loadCar();
  </script>
</body>
</html>
