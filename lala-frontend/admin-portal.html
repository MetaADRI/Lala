<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lala â€” Admin Verification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css?v=6">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
  <link rel="icon" type="image/png" href="logo-removebg-preview.png">
  <style>
    body { background: #F8F9FA; }
    .admin-nav { background: #1B5E20; color: #fff; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .admin-container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
    
    .pcard {
      background: #fff; border-radius: 12px; border: 1px solid #E0E0E0; padding: 20px;
      margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;
      transition: transform 0.2s;
    }
    .pcard:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
    
    .pinfo h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .ploc { font-size: 13px; color: #666; display: flex; align-items: center; gap: 4px; }
    .pdetails { font-size: 12px; color: #888; margin-top: 8px; }
    
    .pbadge { background: #FFF3E0; color: #E65100; font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }
    
    .action-btns { display: flex; gap: 10px; }
    .btn-approve { background: #2E7D32; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .btn-reject { background: #F44336; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }

    .empty-state { text-align: center; padding: 60px 20px; color: #888; }
    .empty-state i { font-size: 48px; color: #DDD; margin-bottom: 16px; }

    .admin-tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid #E0E0E0; }
    .admin-tab {
      background: transparent; border: none; border-bottom: 2px solid transparent;
      padding: 10px 14px; font-size: 14px; font-weight: 600; color: #666;
      cursor: pointer; display: flex; align-items: center; gap: 8px;
    }
    .admin-tab:hover { color: #1B5E20; }
    .admin-tab.active { color: #1B5E20; border-bottom-color: #1B5E20; }
    .tab-count { background: #E8F5E9; color: #1B5E20; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
    .tab-count.hot { background: #FFF3E0; color: #E65100; }

    .hbadge {
      background: #E8F5E9; color: #1B5E20; font-size: 10px; font-weight: 700;
      padding: 4px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.3px;
    }
    .hbadge.pending { background: #FFF3E0; color: #E65100; }
    .hbadge.approved { background: #E8F5E9; color: #1B5E20; }
    .hbadge.rejected { background: #FFEBEE; color: #C62828; }
    .hbadge.suspended { background: #FFEBEE; color: #C62828; }
    .hbadge.paused { background: #FFF8E1; color: #8A6D00; }
    .hbadge.guest { background: #E8F0FE; color: #1A56DB; }
    .hbadge.host { background: #FFF8E1; color: #8A6D00; }
    .hbadge.admin { background: #F3E8FF; color: #6D28D9; }
    .hbadge.role-badge { background: #ECEFF1; color: #455A64; }

    .hcard {
      background: #fff; border-radius: 12px; border: 1px solid #E0E0E0; padding: 18px 20px;
      margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center;
      gap: 16px; flex-wrap: wrap; transition: transform 0.2s;
    }
    .hcard:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
    .hcard .hinfo { flex: 1; min-width: 220px; }
    .hcard .hinfo h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .hcard .hmeta { font-size: 12.5px; color: #666; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
    .hcard .hmeta.doc-link { color: var(--g-mid); cursor: pointer; text-decoration: none; display: inline-flex; }
    .hcard .hmeta.doc-link:hover { text-decoration: underline; }
    .hcard .hdate { font-size: 11.5px; color: #999; margin-top: 6px; }

    .pthumbs { display: flex; gap: 8px; margin-top: 12px; align-items: stretch; flex-wrap: wrap; }
    .pthumbs .pth {
      position: relative; width: 64px; height: 64px; border-radius: 8px; overflow: hidden;
      cursor: zoom-in; border: 1px solid #eee; background: #f5f5f5; flex-shrink: 0;
    }
    .pthumbs .pth img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pthumbs .lead { width: 96px; }
    .pthumbs .more-badge {
      position: absolute; inset: 0; background: rgba(0,0,0,0.55); color: #fff;
      font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    .pthumbs .empty-thumb {
      color: #aaa; font-size: 12px; align-items: center; gap: 6px; display: flex;
      border: 1px dashed #e0e0e0; border-radius: 8px; padding: 12px 16px; cursor: default;
    }

    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 500;
      display: none; align-items: center; justify-content: center; flex-direction: column;
    }
    .lightbox img {
      max-width: 88vw; max-height: 78vh; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .lb-close {
      position: absolute; top: 18px; right: 18px; width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.15); color: #fff; border: none; font-size: 20px; cursor: pointer;
    }
    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px;
      border-radius: 50%; background: rgba(255,255,255,0.15); color: #fff; border: none;
      font-size: 26px; cursor: pointer; line-height: 1;
    }
    .lb-prev { left: 18px; }
    .lb-next { right: 18px; }
    .lb-count { position: absolute; bottom: 22px; color: #fff; font-size: 13px; font-weight: 600; background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 14px; }

    /* ---- MOBILE ---- */
    @media (max-width: 768px) {
      .admin-nav { flex-wrap: wrap; gap: 8px 12px; padding: 12px 14px; }
      .admin-container { margin: 20px auto; padding: 0 12px; }
      .admin-tabs { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
      .admin-tabs::-webkit-scrollbar { display: none; }
      .admin-tab { flex-shrink: 0; }
      .pcard { flex-direction: column; align-items: flex-start; gap: 12px; padding: 16px; }
      .action-btns { width: 100%; }
      .action-btns button { flex: 1; padding: 12px 16px; }
      .pthumbs .lead { width: 64px; }
      .empty-thumb { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="admin-nav">
    <div style="display: flex; align-items: center; gap: 12px;">
      <img src="logo-removebg-preview.png" alt="Lala" style="height: 24px; filter: brightness(0) invert(1);">
      <div class="sora" style="font-weight: 700; font-size: 16px; border-left: 1px solid rgba(255,255,255,0.3); padding-left: 12px;">Admin Portal</div>
    </div>
    <div style="display: flex; gap: 20px; align-items: center;">
      <a href="host-dashboard.html" style="color: #fff; text-decoration: none; font-size: 13px; font-weight: 500;">Dashboard</a>
      <a href="admin-bookings.html" style="color: #fff; text-decoration: none; font-size: 13px; font-weight: 500;">Bookings</a>
      <span id="adminRoleBadge" style="font-size: 11px; font-weight: 700; padding: 3px 12px; border-radius: 9999px; background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.35); display: none;"></span>
      <button onclick="logout()" style="background:transparent; border:1px solid rgba(255,255,255,0.3); color:#fff; font-size:12px; padding: 6px 12px; border-radius: 4px; cursor:pointer;">Logout</button>
    </div>
  </div>

  <div class="admin-container">
    <h1 class="sora" style="font-size: 22px; margin-bottom: 20px;">Admin Portal</h1>

    <div class="admin-tabs">
      <button class="admin-tab active" id="tabListings" onclick="switchTab('listings')">
        Listing Verification <span id="listingCount" class="tab-count">0</span>
      </button>
      <button class="admin-tab" id="tabHosts" onclick="switchTab('hosts')">
        Host Requests <span id="hostCount" class="tab-count">0</span>
      </button>
      <button class="admin-tab" id="tabUsers" onclick="switchTab('users')">
        Users
      </button>
    </div>

    <!-- LISTING VERIFICATION -->
    <section id="sectionListings">
      <div class="flex-between" style="margin-bottom: 24px;">
        <h2 class="sora" style="font-size: 16px;">Verification Queue</h2>
        <div id="queueCount" class="pbadge">0 Pending</div>
      </div>

      <div id="pendingList">
        <!-- Listings will be injected here -->
        <div class="empty-state">
          <i class="ti ti-loader animate-spin"></i>
          <p>Loading verification queue...</p>
        </div>
      </div>
    </section>

    <!-- HOST REQUESTS -->
    <section id="sectionHosts" style="display: none;">
      <div class="flex-between" style="margin-bottom: 24px;">
        <h2 class="sora" style="font-size: 16px;">Become-a-Host Applications</h2>
        <div id="hostQueueCount" class="pbadge">0 Pending</div>
      </div>

      <div id="hostRequestList">
        <!-- Host requests will be injected here -->
        <div class="empty-state">
          <i class="ti ti-loader animate-spin"></i>
          <p>Loading host applications...</p>
        </div>
      </div>
    </section>

    <!-- USERS -->
    <section id="sectionUsers" style="display: none;">
      <div class="flex-between" style="margin-bottom: 24px;">
        <h2 class="sora" style="font-size: 16px;">All Users</h2>
        <div id="userCount" class="pbadge">0 Users</div>
      </div>

      <div id="userList">
        <!-- Users will be injected here -->
        <div class="empty-state">
          <i class="ti ti-loader animate-spin"></i>
          <p>Loading users...</p>
        </div>
      </div>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="session.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem('lala_user'));
    if (!user || user.role !== 'admin') {
      window.location.href = 'index.html';
    }

    const adminBadge = document.getElementById('adminRoleBadge');
    if (adminBadge) {
      adminBadge.textContent = `${user.name || 'Admin'} Â· Admin Account`;
      adminBadge.style.display = 'inline-block';
    }

    // â”€â”€ Toast â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    let toastTimer;
    window.toast = function (msg, type) {
      let t = document.getElementById('toastBox');
      if (!t) {
        t = document.createElement('div');
        t.id = 'toastBox';
        t.className = 'toast';
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.className = 'toast ' + (type || 'ok') + ' show';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    };

    async function loadQueue() {
      const listEl = document.getElementById('pendingList');
      const countEl = document.getElementById('queueCount');
      
      try {
        const listings = await api.getPendingListings();
        countEl.innerText = `${listings.length} Pending`;
        document.getElementById('listingCount').innerText = listings.length;
        
        listEl.innerHTML = '';
        if (listings.length === 0) {
          listEl.innerHTML = `
            <div class="empty-state">
              <i class="ti ti-circle-check" style="color: #2E7D32;"></i>
              <p>Queue is empty. All listings verified!</p>
            </div>
          `;
          return;
        }

        const lbData = {};
        listings.forEach(l => {
          const photos = Array.isArray(l.photos) ? l.photos.filter(Boolean) : [];
          lbData[l.id] = photos;
          const thumbHtml = photos.length
            ? `<div class="pthumbs">${photos.slice(0, 4).map((p, i) => `
                <div class="pth ${i === 0 ? 'lead' : ''}" onclick="openLightbox('${l.id}', ${i})">
                  <img src="${p}" alt="${esc(l.name)} photo">
                  ${i === 0 && photos.length > 1 ? `<span class="more-badge">${photos.length}</span>` : ''}
                </div>`).join('')}</div>`
            : `<div class="pthumbs"><span class="empty-thumb"><i class="ti ti-photo-off"></i> No photos uploaded</span></div>`;

          listEl.insertAdjacentHTML('beforeend', `
            <div class="pcard fade-up visible">
              <div class="pinfo">
                <h3>${esc(l.name)}</h3>
                <div class="ploc"><i class="ti ti-map-pin"></i> ${esc(l.district)}, ${esc(l.city)}</div>
                <div class="pdetails">
                  Type: <strong>${esc(l.type)}</strong> Â· Price: <strong>K${esc(l.price)}</strong> Â· Host: <strong>${esc((l.hostId || '?').split('-')[0])}</strong>
                </div>
                ${thumbHtml}
              </div>
              <div class="action-btns">
                <button onclick="approveListing('${l.id}')" class="btn-approve">Approve</button>
                <button onclick="rejectListing('${l.id}')" class="btn-reject">Reject</button>
              </div>
            </div>
          `);
        });
        window.__lbData = lbData;
      } catch (err) {
        console.error(err);
        listEl.innerHTML = '<div class="empty-state"><p>Couldn\'t load the verification queue.</p><button class="btn-outline" style="margin-top:12px;" onclick="loadQueue()">Retry</button></div>';
      }
    }

    // â”€â”€ Lightbox (photo review) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    let lbPhotos = [];
    let lbIndex = 0;

    function openLightbox(id, index) {
      const photos = window.__lbData?.[id];
      if (!photos || !photos.length) return;
      lbPhotos = photos;
      lbIndex = index;
      showLb();
      document.getElementById('lightbox').style.display = 'flex';
    }

    function showLb() {
      document.getElementById('lbImg').src = lbPhotos[lbIndex];
      document.getElementById('lbCount').innerText = `${lbIndex + 1} / ${lbPhotos.length}`;
    }

    function changeLb(dir) {
      lbIndex = (lbIndex + dir + lbPhotos.length) % lbPhotos.length;
      showLb();
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    document.addEventListener('keydown', (e) => {
      if (document.getElementById('lightbox').style.display !== 'flex') return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') changeLb(-1);
      if (e.key === 'ArrowRight') changeLb(1);
    });

    async function approveListing(id) {
      if (!confirm('Approve this listing for publication?')) return;
      try {
        await api.approveListing(id);
        loadQueue();
        toast('Listing approved.');
      } catch (err) {
        toast('Approval failed', 'err');
      }
    }

    async function rejectListing(id) {
      if (!confirm('Reject and remove this listing permanently?')) return;
      try {
        await api.rejectListing(id);
        loadQueue();
        toast('Listing rejected.');
      } catch (err) {
        toast('Failed to reject listing', 'err');
      }
    }

    // â”€â”€ TABS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    let hostsLoaded = false;
    let usersLoaded = false;

    function switchTab(name) {
      const listingActive = name === 'listings';
      const usersActive = name === 'users';
      document.getElementById('sectionListings').style.display = listingActive ? '' : 'none';
      document.getElementById('sectionHosts').style.display = usersActive || listingActive ? 'none' : '';
      document.getElementById('sectionUsers').style.display = usersActive ? '' : 'none';
      document.getElementById('tabListings').classList.toggle('active', listingActive);
      document.getElementById('tabHosts').classList.toggle('active', !listingActive && !usersActive);
      document.getElementById('tabUsers').classList.toggle('active', usersActive);
      if (!listingActive && !hostsLoaded && !usersActive) {
        hostsLoaded = true;
        loadHostRequests();
      }
      if (usersActive && !usersLoaded) {
        usersLoaded = true;
        loadUsers();
      }
    }

    // â”€â”€ HOST REQUESTS â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    async function loadHostRequests() {
      const listEl = document.getElementById('hostRequestList');
      const countEl = document.getElementById('hostQueueCount');

      try {
        const requests = await api.getAllHostRequests();
        const pending = requests.filter(r => r.status === 'pending').length;
        countEl.innerText = `${pending} Pending`;
        const countEl2 = document.getElementById('hostCount');
        countEl2.innerText = pending;
        countEl2.className = 'tab-count' + (pending > 0 ? ' hot' : '');

        listEl.innerHTML = '';
        if (requests.length === 0) {
          listEl.innerHTML = `
            <div class="empty-state">
              <i class="ti ti-users" style="color: #2E7D32;"></i>
              <p>No host applications yet.</p>
            </div>
          `;
          return;
        }

        requests.forEach(r => {
          const email = r.user ? r.user.email : '';
          const badgeCls = r.status === 'pending' ? 'pending' : r.status;
          const date = new Date(r.createdAt).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
          const reviewed = r.reviewedAt ? new Date(r.reviewedAt).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
          const actions = r.status === 'pending' ? `
            <div class="action-btns">
              <button onclick="approveHostRequest('${r.id}')" class="btn-approve">Approve</button>
              <button onclick="rejectHostRequest('${r.id}')" class="btn-reject">Reject</button>
            </div>` : '';
          const docs = [];
          if (r.idDocumentPhoto) docs.push(`<a href="${r.idDocumentPhoto}" target="_blank" rel="noopener" class="hmeta doc-link"><i class="ti ti-id"></i> National ID</a>`);
          if (r.proofOfOwnershipDocument) docs.push(`<a href="${r.proofOfOwnershipDocument}" target="_blank" rel="noopener" class="hmeta doc-link"><i class="ti ti-file-check"></i> Proof of ownership</a>`);
          listEl.insertAdjacentHTML('beforeend', `
            <div class="hcard fade-up visible">
              <div class="hinfo">
                <h3>
                  <span>${esc(r.name)}</span>
                  <span class="hbadge ${badgeCls}">${esc(r.status)}</span>
                </h3>
                <div class="hmeta"><i class="ti ti-mail"></i> ${esc(email)}</div>
                ${r.phone ? `<div class="hmeta"><i class="ti ti-phone"></i> ${esc(r.phone)}</div>` : ''}
                ${r.nationalIdNumber ? `<div class="hmeta"><i class="ti ti-id"></i> NRC ${esc(r.nationalIdNumber)}</div>` : ''}
                ${r.propertyNumber ? `<div class="hmeta"><i class="ti ti-building-estate"></i> ${esc(r.propertyNumber)}</div>` : ''}
                ${docs.join('')}
                <div class="hdate"><i class="ti ti-calendar"></i> Requested ${date}</div>
                ${r.status !== 'pending' && reviewed ? `<div class="hdate"><i class="ti ti-check"></i> Reviewed ${reviewed}</div>` : ''}
                ${r.status === 'rejected' && r.rejectionReason ? `<div class="hmeta"><i class="ti ti-alert-triangle"></i> Reason: ${esc(r.rejectionReason)}</div>` : ''}
              </div>
              ${actions}
            </div>
          `);
        });
      } catch (err) {
        console.error(err);
        listEl.innerHTML = '<div class="empty-state"><p>Couldn\'t load host applications.</p><button class="btn-outline" style="margin-top:12px;" onclick="loadHostRequests()">Retry</button></div>';
      }
    }

    async function approveHostRequest(id) {
      if (!confirm('Approve this applicant as a host?')) return;
      try {
        const data = await api.reviewHostRequest(id, 'approve');
        if (data.error) { toast(data.error, 'err'); return; }
        loadHostRequests();
        toast('Applicant approved as host.');
      } catch (err) {
        toast('Approval failed', 'err');
      }
    }

    async function rejectHostRequest(id) {
      if (!confirm('Reject this host application?')) return;
      const rejectionReason = prompt('Reason for rejection (shown to the applicant):');
      if (rejectionReason === null) return; // cancelled
      try {
        const data = await api.reviewHostRequest(id, 'reject', rejectionReason.trim());
        if (data.error) { toast(data.error, 'err'); return; }
        loadHostRequests();
        toast('Host application rejected.');
      } catch (err) {
        toast('Failed to reject application', 'err');
      }
    }

    async function loadUsers() {
      const listEl = document.getElementById('userList');
      const countEl = document.getElementById('userCount');
      try {
        const users = await api.getUsers();
        if (!Array.isArray(users)) throw new Error('bad response');
        countEl.innerText = `${users.length} Users`;
        listEl.innerHTML = '';
        if (users.length === 0) {
          listEl.innerHTML = '<div class="empty-state"><p>No users yet.</p></div>';
          return;
        }
        users.forEach(u => {
          const isSelf = u.id === user.id;
          const actions = [];
          if (u.status !== 'active') {
            actions.push(`<button class="btn-approve" onclick="setUserStatus('${u.id}', 'active')">Activate</button>`);
          }
          if (u.status === 'active') {
            actions.push(`<button class="btn-approve" onclick="setUserStatus('${u.id}', 'paused')">Pause</button>`);
            actions.push(`<button class="btn-reject" onclick="setUserStatus('${u.id}', 'suspended')">Suspend</button>`);
          }
          if (u.status === 'paused') {
            actions.push(`<button class="btn-reject" onclick="setUserStatus('${u.id}', 'suspended')">Suspend</button>`);
          }
          listEl.insertAdjacentHTML('beforeend', `
            <div class="hcard fade-up visible">
              <div class="hinfo">
                <h3>
                  <span>${esc(u.name || u.email)} ${isSelf ? '<span class="hbadge role-badge">You</span>' : ''}</span>
                  <span class="hbadge ${u.status}">${esc(u.status)}</span>
                  <span class="hbadge ${u.role}">${esc(u.role)}</span>
                </h3>
                <div class="hmeta"><i class="ti ti-mail"></i> ${esc(u.email)}</div>
                ${u.phone ? `<div class="hmeta"><i class="ti ti-phone"></i> ${esc(u.phone)}</div>` : ''}
              </div>
              ${u.role === 'admin' && !isSelf ? '' : actions.length ? `<div class="action-btns">${actions.join('')}</div>` : ''}
            </div>
          `);
        });
      } catch (err) {
        console.error(err);
        listEl.innerHTML = '<div class="empty-state"><p>Couldn\'t load users.</p><button class="btn-outline" style="margin-top:12px;" onclick="loadUsers()">Retry</button></div>';
      }
    }

    async function setUserStatus(id, status) {
      const action = status === 'suspended' ? 'suspend' : status === 'paused' ? 'pause' : 'activate';
      if (!confirm(`Are you sure you want to ${action} this account?`)) return;
      try {
        const data = await api.setUserStatus(id, status);
        if (data.error) { toast(data.error, 'err'); return; }
        loadUsers();
        toast(`User ${status}.`);
      } catch (err) {
        toast('Failed to update user status', 'err');
      }
    }

    function logout() {
      localStorage.removeItem('lala_token');
      localStorage.removeItem('lala_user');
      window.location.href = 'index.html';
    }

    loadQueue();
  </script>

  <!-- Photo review lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" onclick="closeLightbox()"><i class="ti ti-x"></i></button>
    <button class="lb-nav lb-prev" onclick="event.stopPropagation(); changeLb(-1)">&#8249;</button>
    <img id="lbImg" src="" alt="Property photo" onclick="event.stopPropagation()">
    <button class="lb-nav lb-next" onclick="event.stopPropagation(); changeLb(1)">&#8250;</button>
    <div class="lb-count" id="lbCount"></div>
  </div>
</body>
</html>
